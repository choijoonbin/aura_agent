name: Agent quality

on:
  push:
    branches: [main, dev, dwp-dev]
  pull_request:
    branches: [main, dev, dwp-dev]

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.28'
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}

      - name: Compile source
        run: uv run --locked --python ${{ matrix.python-version }} python -m compileall -q src tests

      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} pytest

      - name: Build package
        if: matrix.python-version == '3.13'
        run: uv build
